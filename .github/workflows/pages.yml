# =============================================================
# theory · GitHub Pages — TheoryMCP consumer docs
#
# Builds the Jekyll site under docs/ and deploys it to GitHub Pages
# at the theorycloud.ai custom domain (served from the domain root).
# (theorymcp.ai is the platform/MCP route host referenced in the content,
# not where these docs are served.)
#
# This repository is the worked example of a Theory Cloud workspace,
# so the docs publish from `main` (there is no separate release line
# to protect). The build is scoped to docs/ changes; a defensive
# `if: github.ref == 'refs/heads/main'` guard makes a workflow_dispatch
# from any other ref a no-op.
# =============================================================

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Manual re-deploy (e.g. after rotating the Pages environment).
  workflow_dispatch:

# Default workflow token stays read-only. Pages/id-token privileges are
# granted only to the deploy job, after the docs build artifact exists.
permissions:
  contents: read

# Coalesce in-flight deploys: queue a second push rather than cancel it,
# so we never skip a commit's publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUNDLE_DEPLOYMENT: "true"
      BUNDLE_FROZEN: "true"
      BUNDLE_PATH: vendor/bundle
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Jekyll build
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --source . \
            --destination ./_site \
            --baseurl ""

      - name: Verify custom-domain root paths
        working-directory: docs
        run: |
          if grep -R -nE --include='*.html' '(href|src)="/(theory)/' ./_site; then
            echo "Found root-relative links carrying the repository path; the custom domain serves from /." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: https://theorycloud.ai/
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
