# =============================================================
# Landing-page host tabs — codex / Claude Code / Antigravity.
# Each block renders inside the .runtime-block UI on the home page.
# `lang` matches the Rouge highlighter id. The MCP server id is
# `theorymcp` in every host config; the route is the one knob.
# =============================================================

- id: codex
  label: codex
  icon: cpu
  install: "codex mcp login https://theorymcp.ai/theorycloud/mcp   # native MCP OAuth"
  lang: toml
  snippet: |
    # .codex/config.toml — codex performs MCP OAuth natively.
    [mcp_servers.theorymcp]
    url            = "https://theorymcp.ai/theorycloud/mcp"
    oauth_resource = "https://theorymcp.ai/theorycloud/mcp"
    scopes         = ["mcp:tools", "ai.kb.query"]

- id: claude_code
  label: Claude Code
  icon: command
  install: "Inside Claude Code: /mcp → authenticate theorymcp   # native MCP OAuth"
  lang: json
  snippet: |
    // .mcp.json at the repo root (Claude Code reads project MCP only from root).
    {
      "mcpServers": {
        "theorymcp": {
          "type": "http",
          "url": "https://theorymcp.ai/theorycloud/mcp"
        }
      }
    }

- id: antigravity
  label: Antigravity
  icon: repeat
  install: "First connect opens a browser once; the mcp-remote bridge holds the token."
  lang: json
  snippet: |
    // .agents/mcp_config.json — Antigravity speaks stdio MCP but cannot do
    // MCP OAuth, so it reaches the route through the mcp-remote stdio bridge.
    {
      "mcpServers": {
        "theorymcp": {
          "command": "npx",
          "args": ["-y", "mcp-remote", "https://theorymcp.ai/theorycloud/mcp"]
        }
      }
    }
